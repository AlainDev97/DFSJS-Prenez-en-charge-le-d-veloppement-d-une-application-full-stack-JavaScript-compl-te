name: mdd-e2e

services:
  postgres-e2e:
    image: postgres:17-alpine
    restart: unless-stopped

    environment:
      POSTGRES_USER: mdd_e2e
      POSTGRES_PASSWORD: ${E2E_POSTGRES_PASSWORD:?Mot de passe E2E manquant}
      POSTGRES_DB: mdd_e2e_db

    ports:
      - "127.0.0.1:5434:5432"

    volumes:
      - postgres_e2e_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mdd_e2e -d mdd_e2e_db"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_e2e_data:
